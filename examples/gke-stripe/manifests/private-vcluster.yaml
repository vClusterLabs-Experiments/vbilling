# Adapted from examples/gke-gpu/03-tenant-private.yaml, vCluster chart 0.36.1.
# A separate tenant: do not apply to the working shared-l4 release.
privateNodes:
  enabled: true
telemetry:
  enabled: false
controlPlane:
  distro:
    k8s:
      version: v1.34.1
  service:
    annotations:
      networking.gke.io/load-balancer-type: Internal
    spec:
      type: LoadBalancer
      loadBalancerSourceRanges:
        - 10.240.0.0/24
  statefulSet:
    scheduling:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
    persistence:
      volumeClaim:
        enabled: true
        size: 5Gi
        storageClass: standard-rwo
        retentionPolicy: Delete
networking:
  podCIDR: 172.20.0.0/16
  serviceCIDR: 172.21.0.0/16
exportKubeConfig:
  additionalSecrets:
    - name: vbilling-kubeconfig
      serviceAccount:
        name: vbilling-reader
        namespace: kube-system
        clusterRole: vbilling-reader
experimental:
  deploy:
    vcluster:
      manifests: |-
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: vbilling-reader
        rules:
          - apiGroups: [""]
            resources: [nodes, pods, persistentvolumeclaims, services]
            verbs: [get, list, watch]
          - apiGroups: [resource.k8s.io]
            resources: [resourceclaims, resourceslices]
            verbs: [get, list]
          - apiGroups: [metrics.k8s.io]
            resources: [pods]
            verbs: [get, list]
