# CUDA workload for shared GPU allocation on GKE.
# Two slots on one real L4 with exactly two time-sharing clients per GPU.
# This is a CUDA benchmark, not model inference.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-nbody
  namespace: gpu-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-nbody
  template:
    metadata:
      labels:
        app: gpu-nbody
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        cloud.google.com/gke-nodepool: l4-shared
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-gpu-sharing-strategy: time-sharing
        cloud.google.com/gke-max-shared-clients-per-gpu: "2"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: benchmark
          image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1
          command: [sh, -ec]
          args:
            - |
              nvidia-smi -L
              while true; do
                /cuda-samples/sample -benchmark -numbodies=32768
                sleep 5
              done
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              nvidia.com/gpu: 1
