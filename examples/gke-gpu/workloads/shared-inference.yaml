# Apply inside the shared-nodes tenant cluster: two pods on a time-sliced L4
# (a quarter GPU each), a CPU service behind an internal load balancer, and a
# 20 GiB volume, so every metric type shows up.
apiVersion: v1
kind: Namespace
metadata: {name: inference}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nbody, namespace: inference}
spec:
  replicas: 2
  selector: {matchLabels: {app: nbody}}
  template:
    metadata: {labels: {app: nbody}}
    spec:
      nodeSelector:
        cloud.google.com/gke-gpu-sharing-strategy: time-sharing
        cloud.google.com/gke-max-shared-clients-per-gpu: "4"
      containers:
        - name: nbody
          image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1
          command: [sh, -c, "while true; do /cuda-samples/sample -benchmark -numbodies=1024000 >/dev/null 2>&1 || sleep 5; done"]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {nvidia.com/gpu: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: inference}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: inference
  annotations: {networking.gke.io/load-balancer-type: Internal}
spec:
  type: LoadBalancer
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: model-cache, namespace: inference}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: cache-warmer, namespace: inference}
spec:
  containers:
    - name: warmer
      image: busybox:1.36
      command: [sh, -c, "dd if=/dev/zero of=/cache/weights.bin bs=1M count=512 && sleep infinity"]
      resources: {requests: {cpu: 100m, memory: 64Mi}}
      volumeMounts: [{name: cache, mountPath: /cache}]
  volumes: [{name: cache, persistentVolumeClaim: {claimName: model-cache}}]
