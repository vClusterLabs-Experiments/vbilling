name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go vet ./...
      - run: go test -race ./...

  vulnerability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./cmd/vbilling

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Test release image pinning and upgrade overrides
        run: python3 -m unittest discover -s scripts/tests -v
      - run: helm lint deploy/helm/vbilling
      # An install refuses production-values.yaml until its placeholders are
      # replaced: lint it with them replaced, the way it is installed.
      - run: helm lint deploy/helm/vbilling -f deploy/helm/production-values.yaml --set region=eu-west-1 --set clusterName=prod-1 --set persistence.storageClass=replicated
      - run: helm template vbilling deploy/helm/vbilling --set adapters='{stripe}' --set stripe.existingSecret=vbilling-stripe > /dev/null

  gke-stripe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidentally committed demo credentials
        run: python3 scripts/check-demo-secrets.py --tracked
      - name: Test the secret check with synthetic fixtures
        run: python3 scripts/check-demo-secrets.py --self-test
      - name: Test demo helpers without cloud credentials
        run: python3 -m unittest discover -s examples/gke-stripe/tests -v
      - name: Check local launcher syntax
        run: bash -n examples/gke-stripe/scripts/run-local.sh
