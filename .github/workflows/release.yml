name: release

# Publishing or explicitly rebuilding a release uses the exact tag's commit.
# CI must pass that commit before any image or asset is replaced.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.3.1)
        required: true
        type: string
        default: v0.3.1

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      series: ${{ steps.release.outputs.series }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - id: release
        name: Validate release source and successful CI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable vX.Y.Z release tag"; exit 1; }
          commit=$(git rev-parse HEAD)
          chart_version=$(awk '$1 == "version:" {print $2}' deploy/helm/vbilling/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/vbilling/Chart.yaml)
          [[ "$chart_version" == "${RELEASE_TAG#v}" && "$app_version" == "${RELEASE_TAG#v}" ]] || { echo "Chart and app versions must match $RELEASE_TAG"; exit 1; }
          ci_ok=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$commit" -f status=completed -f per_page=20 --jq 'any(.workflow_runs[]; .conclusion == "success")')
          [[ "$ci_ok" == true ]] || { echo "CI has not passed commit $commit; wait for ci.yml before publishing"; exit 1; }
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable // false')
          [[ "$immutable" == false ]] || { echo "This release is immutable and cannot be rebuilt in place"; exit 1; }
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          image=$(printf '%s' "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=$RELEASE_TAG"
            echo "series=${RELEASE_TAG%.*}"
            echo "sha=$commit"
            echo "image=$image"
            if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then echo "latest=true"; else echo "latest=false"; fi
          } >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.series }}
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: azure/setup-helm@v4
      - name: Pin the published chart to the built image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.sha }}
          IMAGE_REPOSITORY: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 scripts/prepare-release.py --chart deploy/helm/vbilling --metadata dist/release-metadata.json
          helm lint deploy/helm/vbilling
          helm package deploy/helm/vbilling --destination dist
          cd dist
          sha256sum "vbilling-${RELEASE_TAG#v}.tgz" release-metadata.json > SHA256SUMS
      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.tgz dist/release-metadata.json dist/SHA256SUMS --clobber
