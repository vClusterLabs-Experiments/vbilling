# vBilling Helm values. Every value maps to an environment variable; see
# docs/configuration.html for the full reference.

# Always 1 (0 stops vBilling). vBilling runs as one instance: it holds the
# Lease "vbilling" in its namespace while it meters, and a second instance
# would wait, not Ready. Restarts are safe: the ledger and backfill resume
# where it stopped.
replicaCount: 1

image:
  repository: ghcr.io/vclusterlabs-experiments/vbilling
  tag: v0.3.3
  # Explicit immutable image override. Published charts pin their default
  # repository and tag through Chart.yaml annotations, including upgrades
  # with --reuse-values. Custom repositories and tags remain usable.
  digest: ""
  pullPolicy: IfNotPresent
# Secrets with credentials for a private registry or mirror, for the vBilling
# pod and the configuration check Job.
imagePullSecrets: []
# - name: registry-credentials

# Replace the chart name in object names, or the whole name (the default is
# the release name, with "-vbilling" unless it contains "vbilling").
nameOverride: ""
fullnameOverride: ""

# Destinations usage fans out to. Built-in: stripe, metronome, lago, webhook, noop.
# Each destination has its own cursor into the ledger, so one billing platform
# being down never blocks another.
adapters:
  - lago
# Deprecated single-adapter form from v0.1; used only when `adapters` is empty.
adapter: ""

# Where this vBilling instance meters. Run one vBilling per control plane
# cluster (region): usage, ledger and billing state stay in that region.
region: default
clusterName: control-plane
# How tenant clusters map to billing customers: "cluster" (one customer per
# tenant cluster) or "project" (one per vCluster Platform project), where the
# vbilling.vcluster.com/tenant label always wins; or "platform": the vCluster
# Platform Tenant that owns the cluster's project, else the project, read
# from the Platform API (see platform below).
tenantSource: cluster

billing:
  defaultPlanCode: vcluster-standard # Lago plan code / Stripe plan tag
  currency: USD
  # How long after a window ends it is metered (at least 5s). On spot or
  # preemptible GPUs use 75s: Kubernetes marks a node that died without
  # warning 40 to 50s after its last heartbeat, and the window it died in is
  # then billed only up to that heartbeat. Usage reaches billing that much later.
  collectionDelay: 5s
  # Plan for tenants without a vbilling.vcluster.com/plan setting, by tenant
  # class (Lago plan code, Stripe plan tag or Metronome rate card).
  planByClass: {}
  #  enterprise: vcluster-enterprise
  #  dev: vcluster-dev
  # More keys to price built-in metrics on (PRICING_KEYS), by metric code.
  # Each key must be one the metric's events carry: check-config lists them.
  # Not with the stripe adapter (split Stripe meters with stripe.splitMetersBy).
  # On Metronome a new key set is a new billable metric: see the Metronome
  # page before you change it on a running install.
  pricingKeys: {}
  #  vcluster_private_node_hours: [public_ip, zone]
  #  vcluster_gpu_hours: [gpu_type]
  #  vcluster_cpu_core_hours: [sku]     # the node's SKU, as on its node-hours
  #  vcluster_memory_gb_hours: [sku]
  #  vcluster_public_ip_hours: [ip_family]
  # Price coverage: vBilling reads (never writes) each billing platform's
  # products, rates, prices and charges, and reports usage it has no price
  # for (GET /api/v1/pricing). warn: report only. hold: also keep that usage
  # out of the billing platform until the price exists, then ship it in
  # order. off: no checks.
  # hold releases usage still unpriced after 23 hours. Price new SKUs
  # before usage starts: late usage can miss a finalized invoice.
  priceCheck:
    mode: warn # warn | hold | off
  # Storage included in a price, such as 32 GiB with every node
  # (ALLOWANCES_FILE). A billing platform's free tier applies to a customer's
  # total, never per node, cluster or volume: vBilling applies the allowance
  # where it is defined, at every second of a window, and bills what is above
  # it as vcluster_storage_overage_gb_hours. With any allowance, every storage
  # class is billed through that metric (a class without an allowance is all
  # overage), and vcluster_storage_gb_hours stays in the ledger, exports and
  # webhooks as an informational record of the whole capacity. Price the
  # overage metric in your billing platform. See docs/pricing-models.html.
  allowances: []
  # - metric: vcluster_storage_gb_hours  # the only metric that takes one
  #   included: 32                       # GiB
  #   # node: each of the cluster's own nodes (dedicated or private) while it
  #   # is billed; a cluster without its own nodes includes nothing.
  #   # cluster: the cluster. volume: each volume.
  #   per: node
  #   # Optional. The listed classes share one allowance, the first listed
  #   # taking from it first, and other classes have none. Without it, every
  #   # class no other entry lists has an allowance of its own. A claim
  #   # without a storage class is metered under the class "default".
  #   storageClasses: [fast-ssd, standard]

metering:
  # requests (exact): requests times lifetime. usage or max: a metrics-server
  # reading per window, an estimate, and none for windows collected late.
  cpuMemoryBasis: requests # requests | usage | max
  meterControlPlane: false # also bill the tenant cluster's own control plane pods
  meterByNamespace: false # add the tenant cluster namespace as a dimension (internal chargeback)
  gpuResources: [nvidia.com/gpu, amd.com/gpu] # MIG resources (nvidia.com/mig-*) are always detected
  skuLabel: "" # node label whose value is the SKU (e.g. vbilling.vcluster.com/sku)
  capacityTypeLabel: vbilling.vcluster.com/capacity-type # on-demand | spot | preemptible | reserved
  unhealthyNodeTaints: [node.kubernetes.io/not-ready, node.kubernetes.io/unreachable]
  dedicatedNodeLabel: "" # extra dedicated-node selector, "key=%s" (%s = tenant cluster name)
  # Metrics you push through POST /api/v1/events or /api/v1/records. A list
  # (or the v0.2 string "code:unit[:key|key],...").
  customMetrics: []
  # - code: inference_output_tokens
  #   name: Inference output tokens
  #   unit: tokens
  #   groupKeys: [sku]
  # - code: vllm_output_tokens   # a second source, compared with crossChecks
  #   unit: tokens
  #   billable: false

# Clusters with their own nodes (vCluster Private Nodes, Auto Nodes,
# Standalone) run workloads the control plane cluster never sees. vBilling
# meters them through their own API: through the vCluster Platform proxy with
# tenantSource: platform, otherwise with the read-only kubeconfig vCluster
# exports into the Secret vbilling-kubeconfig (exportKubeConfig.additionalSecrets).
# Nodes that also exist in the control plane cluster are never billed twice.
tenantAPI:
  privateNodeBilling: node # node: bill private nodes whole | usage: bill the pods running on them
  # Tenant clusters outside this control plane cluster (vCluster Standalone):
  # a Secret holding clusters.yaml plus the kubeconfig files it lists, mounted
  # at /etc/vbilling/tenants.
  externalClustersSecret: ""

prometheus:
  # Any Prometheus HTTP API (Prometheus, Thanos, Mimir, VictoriaMetrics). Enables
  # egress and GPU utilization, e.g. http://prometheus.monitoring.svc:9090
  url: ""
  egressQuery: "" # PromQL template with {{namespace}}, {{vcluster}}, {{window}}
  # GPU utilization. The default reads DCGM_FI_DEV_GPU_UTIL with either the
  # namespace or exported_namespace label. Same templates; "none" disables it.
  gpuUtilQuery: ""
  gpuCountQuery: "" # devices per GPU model, used with the default utilization query
  # Auth. Headers are stored in the chart Secret, e.g. {X-Scope-OrgID: tenant-1}
  # for Mimir or {Authorization: "Basic ..."}. Or point existingSecret at a
  # Secret with key "headers" in "Name=value,Name2=value2" form.
  headers: {}
  existingSecret: ""
  bearerTokenFile: "" # re-read per query, e.g. /var/run/secrets/kubernetes.io/serviceaccount/token
  # "vcluster-platform": read vCluster Platform fleet observability, whose write
  # gateway labels every series with vcluster_platform_instance/project.
  preset: ""
  # Label that names the source cluster on series from clusters with their
  # own nodes (Private Nodes, Auto Nodes, Standalone): an external label their
  # Prometheus agent adds when it remote writes, e.g. {vcluster: team-a}.
  # A cluster can instead name a Prometheus that sees only it with the
  # vbilling.vcluster.com/prometheus-url annotation (https://... or
  # tenant-service://NAMESPACE/NAME:PORT through its API server).
  sourceLabel: vcluster
  # Metrics read from Prometheus for every cluster and window. Use counter:
  # (a plain series selector) for anything you bill: vBilling reads the raw
  # samples and bills the exact increase per window, and a Prometheus outage
  # only delays usage. query: results are estimates and are marked as such.
  # Templates: {{selector}} and {{matchers}} (scope the series to the
  # cluster, whatever its tenancy model), {{namespace}} {{vcluster}}
  # {{instance}} {{project}} {{tenant}} {{tenant_cluster}} {{window}} {{window_seconds}}
  metrics: []
  # - code: inference_output_tokens
  #   name: Inference output tokens
  #   unit: tokens
  #   dimensions: [model_name]
  #   skuLabel: model_name
  #   counter: vllm:generation_tokens_total{{selector}}

platform:
  cluster: "" # vCluster Platform cluster name of this control plane cluster (multi-cluster setups)
  # tenantSource: platform. Owners and vbilling.vcluster.com/ settings come
  # from Platform Tenants and Projects only (settings on a cluster's workload,
  # namespace or instance are ignored); clusters with their own nodes are
  # reached only through the Platform proxy with the same access key
  # (vbilling-kubeconfig Secrets are not read). See docs/security.html.
  url: "" # e.g. https://platform.example.com
  accessKey: "" # prefer existingSecret
  existingSecret: "" # Secret with key access-key
  caSecret: "" # Secret with key ca.crt that signed the Platform's certificate
  insecure: false # skip TLS verification (self-signed test installs only)

watchNamespaces: []

lago:
  apiURL: "http://lago-api.lago-system.svc.cluster.local:3000"
  apiKey: ""
  existingSecret: "" # key: api-key
  # Price card: amounts vBilling uses when it creates a charge, or a charge
  # filter for a new SKU. Amounts that already exist in Lago are never changed,
  # so prices edited in the Lago UI stay. Quote amounts to keep every digit.
  # A new SKU without an amount here is priced like its metric's charge.
  priceCard: {}
  # vcluster_gpu_hours:
  #   amount: "0"
  #   sku:
  #     NVIDIA-H100-80GB-HBM3: "2.49"
  # inference_output_tokens:
  #   amount: "0.000002"
  priceCardConfigMap: "" # existing ConfigMap with key price-card.yaml, used instead of priceCard
  # Plans besides billing.defaultPlanCode whose charges and SKU filters vBilling
  # keeps up to date. Other plans are never changed.
  managedPlans: []

stripe:
  apiKey: "" # sk_test_... / sk_live_... / rk_... (restricted keys work)
  existingSecret: "" # keys: api-key, webhook-secret
  apiBase: https://api.stripe.com # tests only (stripe-mock)
  # Stripe meters cannot price on dimensions, so meters are split by these
  # event fields (H100 and L40S GPU-hours get separate meters and prices).
  # Add capacity_type to price spot and on-demand differently.
  splitMetersBy: [sku]
  autoSubscribe: false # subscribe tenants to metered prices tagged metadata[vbilling_plan]=<plan>
  webhookSecret: "" # whsec_... enables /webhooks/stripe (dunning, alerts)
  # Prices vBilling creates in Stripe when missing, per plan, with their
  # meters. Existing prices are never changed. Amounts are in the currency's
  # main unit, per unit or per `per` units. See docs/stripe.html#price-card.
  priceCard: {}
  #  currency: usd
  #  interval: month
  #  plans:
  #    dedicated-a100:
  #      vcluster_gpu_hours: {sku: {NVIDIA-A100-SXM4-40GB: "2.20"}}
  #      vcluster_instance_hours: {amount: "0.10", name: Cluster control plane hour}
  #    serverless:
  #      inference_input_tokens: {per: 1000000, sku: {qwen2.5-7b-instruct: "0.20"}}
  #      inference_cached_input_tokens: {per: 1000000, sku: {qwen2.5-7b-instruct: "0.05"}}
  #      inference_output_tokens: {per: 1000000, sku: {qwen2.5-7b-instruct: "0.60"}}

metronome:
  apiToken: ""
  existingSecret: "" # keys: api-token, webhook-secret
  apiBase: https://api.metronome.com # tests only
  # false (default): vBilling only sends usage, keyed on the tenant ID as the
  # customer's ingest alias, and reads Metronome to check prices. Customers,
  # billable metrics and contracts stay yours. true: vBilling creates billable
  # metrics and customers, a contract on rateCard when set, and with
  # stripe.apiKey a linked Stripe customer. See docs/metronome.html.
  provision: false
  # Deprecated, from v0.3.0, where linking a Stripe customer implied creating
  # customers: true is read as provision: true, so values written for v0.3.0
  # keep working. Set provision; the Stripe link follows from stripe.apiKey.
  stripeLink: false
  rateCard: "" # provision only: rate card alias or ID for each tenant's contract
  webhookSecret: "" # enables /webhooks/metronome (spend and credit alerts)

webhook:
  url: "" # CloudEvents batches to your data platform
  secret: ""
  existingSecret: "" # key: secret
  headers: {}

api:
  port: 8080
  # Every endpoint except /healthz and /readyz needs this token, /metrics
  # included (the ServiceMonitor gets it). Empty: the chart generates one in
  # its Secret and keeps it across upgrades (helm lookup). Tools that render
  # with helm template cannot look it up: set token or existingSecret there.
  token: ""
  ingestToken: "" # for POST /api/v1/events and /api/v1/records; generated when empty, never the API token
  # Ingest tokens bound to one tenant ({tenant: token}): usage sent with such
  # a token is always billed to that tenant, so a gateway inside a tenant's
  # cluster can never report usage for another tenant.
  tenantIngestTokens: {}
  existingSecret: "" # keys: api-token (required), ingest-token, ingest-tokens
  service:
    type: ClusterIP
    port: 8080

# Per-request usage (POST /api/v1/records): AI gateways and inference servers
# post one record per request; vBilling stores it durably and bills one event
# per tenant, metric and window. See docs/usage-sources.html.
records:
  # accept (and report) or reject pushed usage for tenants vBilling does not
  # know. It decides for both push paths: records and POST /api/v1/events.
  # With reject, an ingest token can never create usage, or a customer at the
  # billing platform, for a tenant that does not exist.
  unknownTenants: accept
  # The built-in format for LiteLLM's generic API logger (?format=litellm). It
  # declares inference_input_tokens and inference_output_tokens.
  litellm: false
  # Read LiteLLM's spend logs back as records, to fill what the generic API
  # logger's push lost (vBilling down, a dropped batch). Pushed and pulled
  # copies of a request count once. Setting url enables it and the litellm
  # format. Needs LiteLLM v1.103.0 or later with a database.
  pullLiteLLM:
    url: "" # LiteLLM proxy base URL, e.g. http://litellm.litellm.svc:4000
    key: "" # LiteLLM master or proxy admin key, stored in the chart's Secret
    existingSecret: "" # or a Secret with the key under litellm-key
    # When the push uses an ingest token bound to one tenant, or names its own
    # client (X-VBilling-Client), pin the pull the same way, so pulled copies
    # of pushed requests count once.
    tenant: ""
    client: litellm
  # Read any other gateway's request log back as records (RECORDS_PULL_FILE),
  # like pullLiteLLM: rows go through a format below and count once with
  # the pushed copies. Tokens come from Secrets through pullEnv, as
  # ${RECORDS_PULL_...} in a header.
  pull: []
  #  - name: kong-logs
  #    format: kong          # a format from records.formats
  #    client: kong          # the push's X-VBilling-Client (default: the format name)
  #    url: "https://logs.example.com/requests?from={{from}}&to={{to}}&page={{page}}&limit={{limit}}"
  #    headers: {Authorization: "Bearer ${RECORDS_PULL_KONG_TOKEN}"}
  #    rows: data            # path to the array of rows in the response
  #    paging: {mode: page, limit: 500}
  #    interval: 5m
  #    lookback: 1h
  pullEnv: []
  #  - {name: RECORDS_PULL_KONG_TOKEN, secret: kong-logs, key: token}
  # Payload formats besides vbilling and litellm, e.g. a Kong HTTP Log payload:
  formats: {}
  #  kong:
  #    id: request.id
  #    time: started_at
  #    tenant: consumer.username
  #    usage:
  #      inference_input_tokens: ai.proxy.usage.prompt_tokens
  #      inference_output_tokens: ai.proxy.usage.completion_tokens
  #    sku: ai.proxy.meta.response_model

# Compare two sources of the same usage per tenant and hour, e.g. tokens from
# the gateway (billed) and from the inference engine's counters. Divergence
# above the tolerance shows in GET /api/v1/sources and /metrics.
crossChecks: []
# - primary: inference_output_tokens
#   secondary: vllm_output_tokens
#   tolerancePercent: 2

enforcement:
  # observe: record billing state only. annotate: also annotate tenant
  # clusters and label their namespaces. enforce: also label suspended
  # namespaces so the admission policy below blocks new pods.
  mode: observe
  # "key=state,...": a key is a webhook event type, or alert:<name or ID> for
  # one Metronome threshold notification (it wins over its type), e.g.
  # "alerts.low_remaining_commit_balance_reached=paused,alert:Wallet below $50=warning"
  rules: ""
  # Grace periods (ENFORCEMENT_ESCALATIONS): a billing hold that stays at
  # from for after is raised to to. after takes d, h, m and s, at least 1m.
  # Only delinquent and suspended escalate, by one rule each; the clock
  # starts when the hold reached its state, and a payment that lifts the
  # hold ends it. Operator holds never escalate. GET /api/v1/billing-states
  # shows each tenant's next escalation (escalation.to, escalation.at).
  # See docs/private-nodes.html#escalations.
  escalations: []
  # - {from: delinquent, after: 72h, to: suspended}
  # - {from: suspended, after: 7d, to: paused}
  # enforce mode: block a suspended or paused tenant's LiteLLM teams (its
  # tenant ID and vbilling.vcluster.com/aliases) and unblock them when it is
  # active again; blocks set by an administrator are never lifted. Uses
  # records.pullLiteLLM's url and admin key. LiteLLM applies a block after its
  # key cache expires (60s by default): set general_settings
  # user_api_key_cache_ttl: 5 in LiteLLM to make it take effect within 5s.
  gateway:
    litellm: false
  admissionPolicy:
    enabled: false # ValidatingAdmissionPolicy (Kubernetes 1.30+) blocking new pods in suspended namespaces
  # Also install the policy inside each suspended tenant's clusters through
  # their own API. Clusters with their own nodes (Private Nodes, Auto Nodes,
  # Standalone) never send pods through the control plane cluster, so this is
  # the only enforcement that reaches them. The tenant API credentials need
  # create on validatingadmissionpolicies and validatingadmissionpolicybindings,
  # and get, update and delete on the one named vbilling-suspended (see
  # docs/private-nodes.html#enforcement).
  inCluster: false
  # Pausing (state "paused", enforce mode): each of the tenant's clusters is
  # paused the way `vcluster pause` does it, after the workloads on its own
  # nodes are stopped, and capacity stops billing at that second. Clearing
  # the hold resumes it. See docs/private-nodes.html#pause.
  pause:
    # What keeps billing while paused: storage, load_balancers, nodes,
    # control_plane, workloads, or none. Without workloads, the usage of a
    # paused cluster's pods stops at the second of the pause, even while
    # they take their termination grace period to stop.
    keepBilling: storage,load_balancers
    # How long to wait for workloads on a cluster's own nodes to stop before
    # its control plane is stopped.
    # Namespaces whose DaemonSets (GPU driver, device plugin, CNI) keep
    # running on a paused cluster's own nodes; every other pod is stopped.
    # Empty: kube-system, kube-flannel, calico-system, tigera-operator,
    # cilium, gpu-operator, nvidia-gpu-operator, network-operator and
    # nvidia-network-operator. "none" stops every DaemonSet.
    keepNamespaces: ""

# Where the usage ledger lives. vBilling is one pod with one ledger: what
# these volumes are made of decides what a lost node or disk costs.
#   - Data volume: replicated or network-attached storage. On a node-local
#     class (local-path, hostPath, a local PersistentVolume) the ledger is
#     pinned to one node and is gone with that node or its disk.
#   - Archive volume: on, and on storage that does not fail together with the
#     data volume: another storage class or failure domain. It is the only
#     place usage records are kept outside the data volume: the archive of
#     segments older than 7 days, and the ledger mirror, a live copy of the
#     data volume from which vBilling restores itself. Object storage through
#     a CSI driver (existingClaim) holds the archive only: no mirror is kept
#     on a bucket.
# The install notes warn when the values show a fragile setup (no archive, the
# mirror off, or both volumes on one storage class). deploy/helm/production-values.yaml is a
# starting point with placeholders for both classes.
persistence:
  enabled: true # the ledger is the durable outbox: keep it on a volume
  size: 5Gi
  storageClass: "" # empty: the cluster's default class. Never a node-local one in production
  # Long-term archive for invoice disputes (ARCHIVE_DIR). Before compaction
  # deletes a ledger segment older than 7 days, vBilling gzips it into the
  # archive (about 86 bytes per usage event) with a small index file of its
  # own. Without this volume there is no archive: an archive inside the ledger
  # volume would grow until it stopped metering.
  # vBilling never deletes from it: keep it as long as invoices can be disputed,
  # 13 months or more. `vbilling ledger verify` proves it unaltered and
  # `vbilling ledger export` reads usage back (docs: Retention and disputes).
  #
  # A bucket mounted through a CSI driver is the expected way to reach object
  # storage, e.g. Cloud Storage FUSE (GCS) or Mountpoint for Amazon S3: bind a
  # PersistentVolumeClaim to the bucket and set existingClaim. vBilling writes
  # every archive file once, under its final name, and never renames, appends
  # to or overwrites one, so the mount only has to let the pod user (65532)
  # create files and directories. Deleting old files (retention) needs
  # Mountpoint's allow-delete. Mount options: docs, Retention and disputes.
  # vBilling writes to <mountPath>/<pod name>.
  #
  # Without existingClaim, the chart adds a volumeClaimTemplate. Kubernetes
  # does not allow adding one to an existing StatefulSet: run
  # `kubectl delete statefulset <name> --cascade=orphan` (pods, volumes and
  # data stay) before the upgrade that enables it.
  #
  # The ledger mirror (LEDGER_MIRROR) is a live copy of everything on the data
  # volume (both ledgers, cursors, held events, counter baselines, billing
  # states), a second or two behind. When the data volume is lost, vBilling
  # restores itself from it at the next start and continues the same ledger;
  # `vbilling ledger restore` does the same by hand. It lives on a volume of
  # its own with persistence.mirror (below), otherwise on this volume, in
  # <mountPath>/<pod name>/mirror.
  #   auto  kept, except where the mirror's directory is a bucket mounted
  #         through FUSE: the mirror appends to its files after every window,
  #         and a bucket uploads the whole object again for that, or refuses
  #   on    kept on any filesystem
  #   off   not kept: losing the data volume then loses every record that is
  #         not archived or delivered yet
  # With the mirror on this volume, size it for the archive plus a copy of the
  # data volume. The mirror leaves a tenth of the volume to the archive and
  # stops copying before that. It holds the API and ingest tokens: protect the
  # mirror's volume like the data volume.
  archive:
    enabled: false
    existingClaim: "" # PVC to mount, e.g. one bound to a bucket by a CSI driver
    size: 20Gi # volumeClaimTemplate size when existingClaim is empty
    storageClass: "" # volumeClaimTemplate class: not the data volume's class, see above
    mountPath: /var/lib/vbilling-archive
    mirror: auto # LEDGER_MIRROR: auto | on | off, see above; also for persistence.mirror
  # The ledger mirror on a volume of its own (LEDGER_MIRROR_DIR): the way to
  # keep a mirror when the archive is a bucket, which holds no mirror. The
  # chart adds a PersistentVolumeClaim per pod, mounts it at
  # /var/lib/vbilling-mirror and keeps the mirror in
  # /var/lib/vbilling-mirror/<pod name>. Put it in another failure domain than
  # the data volume: a regional disk, or a file share such as Filestore, EFS or
  # Azure Files. Size it for a copy of the data volume: the mirror leaves a
  # tenth of it free. A mirror kept earlier in <archive>/mirror is no longer
  # updated: vBilling names it in its log and never restores it by itself.
  # Like the archive's, this volumeClaimTemplate cannot be added to an existing
  # StatefulSet: `kubectl delete statefulset <name> --cascade=orphan` first.
  mirror:
    enabled: false
    size: 10Gi
    storageClass: "" # a class in another failure domain than persistence.storageClass
    accessModes: [ReadWriteOnce] # ReadWriteMany for a file share that offers only that

# Configuration check. Before every install and upgrade, a Job runs
# `vbilling check-config` with the new values: the same settings and files the
# new pod would get, read and checked exactly as vBilling does at start-up
# (metric definitions, records formats and pulls, price cards, enforcement
# rules). If vBilling would refuse them, the Job fails, the release is not
# changed and the running pod keeps metering. Without it, a mistake in the
# values is found by the new pod, and nothing meters until it is reverted.
# Why a check failed:
#   kubectl -n <namespace> logs job/<release name>-config-check
# (a Helm that knows helm.sh/hook-output-log-policy prints it with the
# failure). The failed Job stays until the next install or upgrade.
#
# The Job contacts nothing, has no Kubernetes API access and mounts neither
# the data nor the archive volume. It runs as a Helm pre-install and
# pre-upgrade hook, which Argo CD runs as a PreSync hook. It reads Secrets
# you keep yourself (existingSecret) when they exist; the Secret the chart
# renders does not exist yet at that point, so credentials given in the
# values are not checked. Tools that apply the output of `helm template`
# without hook support should render with --no-hooks or disable the check.
configCheck:
  enabled: true
  activeDeadlineSeconds: 180 # give up when the Job cannot be scheduled or pull the image in time
  # Requests and limits of the check. Empty: those of the vBilling pod
  # (resources), so the node needs room for one more such pod for a few seconds.
  resources: {}

serviceMonitor:
  enabled: false
  interval: 30s

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Placement. Keep vBilling off the GPU nodes it meters: they are the nodes
# tenants fill, drain and replace, and billing has to outlive them. Run it on
# the nodes that hold the control plane cluster's own services, with storage
# that can follow the pod to another node (persistence above). The
# configuration check Job is scheduled the same way.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# A PriorityClass above tenant workloads, so node pressure never evicts
# billing first.
priorityClassName: ""
