apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vbilling.fullname" . }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
rules:
  # Discover tenant clusters (StatefulSet or Deployment control planes).
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  # Meter synced workloads, volumes, load balancers and nodes; read namespace
  # metadata. watch: pods and nodes deleted between windows are still billed.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Node Leases: when a node's kubelet goes silent, its last renewal dates
  # the outage (get only, read just for nodes marked Unknown).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
  # GPUs allocated through Dynamic Resource Allocation.
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices"]
    verbs: ["get", "list"]
  # Clusters with their own nodes: only the read-only kubeconfig vCluster
  # exports for vBilling (the Secret name is fixed).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vbilling-kubeconfig"]
    verbs: ["get"]
  # Usage-based CPU and memory from metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Optional enrichment from vCluster Platform (project, display name).
  - apiGroups: ["management.loft.sh"]
    resources: ["virtualclusterinstances"]
    verbs: ["get", "list"]
  {{- if ne .Values.enforcement.mode "observe" }}
  # Billing-state enforcement: annotate tenant clusters, label namespaces, emit events.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  {{- if eq .Values.enforcement.mode "enforce" }}
  # Pausing a cluster deletes the pods it synced here, as `vcluster pause` does.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  {{- end }}
  {{- end }}
