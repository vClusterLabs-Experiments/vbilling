{{- if gt (int .Values.replicaCount) 1 -}}
{{- fail (printf "replicaCount is %v: this chart supports one active instance with its durable ledger. Per-replica volumes cannot provide shared-ledger failover: a replacement needs the previous writer's accepted records, source identity and delivery state. Set replicaCount to 1; shared-ledger HA is tracked in issue #17." .Values.replicaCount) -}}
{{- end -}}
{{- $placeholders := regexFindAll "REPLACE_WITH_[A-Z0-9_]+" (toYaml .Values) -1 | uniq -}}
{{- if $placeholders -}}
{{- fail (printf "the values still hold a placeholder: %s. Replace every REPLACE_WITH_ value with the one of your installation (deploy/helm/production-values.yaml marks what an installation has to name): a placeholder as region or cluster name would be billed as written, and one as storage class leaves the pod without its volume." (join ", " $placeholders)) -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vbilling.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "vbilling.fullname" . }}
  selector:
    matchLabels:
      {{- include "vbilling.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vbilling.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/prometheus-metrics: {{ toYaml .Values.prometheus.metrics | sha256sum }}
        checksum/files: {{ include (print $.Template.BasePath "/files.yaml") . | sha256sum }}
        checksum/lago-price-card: {{ toYaml .Values.lago.priceCard | sha256sum }}
    spec:
      serviceAccountName: {{ include "vbilling.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vbilling
          image: {{ include "vbilling.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "vbilling.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          {{- /* The configuration check Job renders the same environment and mounts (config-check.yaml). */}}
          env:
            {{- include "vbilling.env" (dict "root" . "check" false) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/vbilling
            {{- if .Values.persistence.archive.enabled }}
            - name: archive
              mountPath: {{ .Values.persistence.archive.mountPath }}
            {{- end }}
            {{- with include "vbilling.configVolumeMounts" (dict "root" . "check" false) | trimPrefix "\n" }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- $archiveClaim := and .Values.persistence.archive.enabled .Values.persistence.archive.existingClaim }}
      {{- $configVolumes := include "vbilling.configVolumes" (dict "root" . "check" false) | trimPrefix "\n" }}
      {{- if or (not .Values.persistence.enabled) $archiveClaim $configVolumes }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $archiveClaim }}
        - name: archive
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.archive.existingClaim }}
        {{- end }}
        {{- with $configVolumes }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with include "vbilling.scheduling" . | trimPrefix "\n" }}
      {{- . | nindent 6 }}
      {{- end }}
  {{- $archiveTemplate := and .Values.persistence.archive.enabled (not .Values.persistence.archive.existingClaim) }}
  {{- if or .Values.persistence.enabled $archiveTemplate }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- if $archiveTemplate }}
    - metadata:
        name: archive
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.archive.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.archive.size }}
    {{- end }}
  {{- end }}
