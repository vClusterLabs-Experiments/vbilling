{{- if gt (int .Values.replicaCount) 1 -}}
{{- fail (printf "replicaCount is %v: vBilling runs as one instance. Each replica would keep its own ledger, so gateway records would split between replicas and billing platforms would keep only one share of each window, and a second replica cannot take over either, because its volume holds none of the first one's ledger. Set replicaCount to 1: a restart is safe, the ledger and backfill resume where vBilling stopped." .Values.replicaCount) -}}
{{- end -}}
{{- $adapters := include "vbilling.adapters" . | splitList "," -}}
{{- $files := or .Values.records.formats .Values.records.pull (and .Values.metering.customMetrics (not (kindIs "string" .Values.metering.customMetrics))) (and (has "stripe" $adapters) .Values.stripe.priceCard) -}}
{{- $lagoPriceCard := and (has "lago" $adapters) (or .Values.lago.priceCard .Values.lago.priceCardConfigMap) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vbilling.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "vbilling.fullname" . }}
  selector:
    matchLabels:
      {{- include "vbilling.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vbilling.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/prometheus-metrics: {{ toYaml .Values.prometheus.metrics | sha256sum }}
        checksum/files: {{ include (print $.Template.BasePath "/files.yaml") . | sha256sum }}
        checksum/lago-price-card: {{ toYaml .Values.lago.priceCard | sha256sum }}
    spec:
      serviceAccountName: {{ include "vbilling.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vbilling
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          env:
            - name: ADAPTERS
              value: {{ include "vbilling.adapters" . | quote }}
            - name: REGION
              value: {{ .Values.region | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: DEFAULT_TENANT_CLASS
              value: {{ .Values.tenantClass | quote }}
            - name: TENANT_SOURCE
              value: {{ .Values.tenantSource | quote }}
            - name: DATA_DIR
              value: /var/lib/vbilling
            - name: RETENTION
              value: {{ .Values.persistence.retention | quote }}
            {{- if .Values.persistence.archive.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ARCHIVE_DIR
              value: {{ printf "%s/$(POD_NAME)" (trimSuffix "/" .Values.persistence.archive.mountPath) | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.api.port }}"
            - name: DEFAULT_PLAN_CODE
              value: {{ .Values.billing.defaultPlanCode | quote }}
            - name: BILLING_CURRENCY
              value: {{ .Values.billing.currency | quote }}
            - name: PRICE_CHECK
              value: {{ (.Values.billing.priceCheck).mode | default "warn" | quote }}
            - name: PRICE_CHECK_INTERVAL
              value: {{ (.Values.billing.priceCheck).interval | default "10m" | quote }}
            - name: PRICE_CHECK_LOOKBACK
              value: {{ (.Values.billing.priceCheck).lookback | default "24h" | quote }}
            - name: PRICE_CHECK_MAX_HOLD
              value: {{ (.Values.billing.priceCheck).maxHold | default "28d" | quote }}
            - name: COLLECTION_INTERVAL
              value: {{ .Values.billing.collectionInterval | quote }}
            - name: COLLECTION_DELAY
              value: {{ .Values.billing.collectionDelay | default "5s" | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.billing.reconcileInterval | quote }}
            - name: MAX_BACKFILL
              value: {{ .Values.billing.maxBackfill | quote }}
            - name: OFFBOARD_GRACE
              value: {{ .Values.billing.offboardGrace | quote }}
            - name: CPU_MEMORY_BASIS
              value: {{ .Values.metering.cpuMemoryBasis | quote }}
            - name: METER_CONTROL_PLANE
              value: {{ .Values.metering.meterControlPlane | quote }}
            - name: METER_BY_NAMESPACE
              value: {{ .Values.metering.meterByNamespace | quote }}
            - name: GPU_RESOURCES
              value: {{ join "," .Values.metering.gpuResources | default "none" | quote }}
            - name: SKU_LABEL
              value: {{ .Values.metering.skuLabel | quote }}
            - name: CAPACITY_TYPE_LABEL
              value: {{ .Values.metering.capacityTypeLabel | quote }}
            - name: UNHEALTHY_NODE_TAINTS
              value: {{ join "," .Values.metering.unhealthyNodeTaints | default "none" | quote }}
            - name: VCLUSTER_NODE_LABEL
              value: {{ .Values.metering.dedicatedNodeLabel | quote }}
            - name: REGION_FROM_NODE
              value: {{ .Values.metering.regionFromNode | quote }}
            {{- if kindIs "string" .Values.metering.customMetrics }}
            - name: CUSTOM_METRICS
              value: {{ .Values.metering.customMetrics | quote }}
            {{- else if .Values.metering.customMetrics }}
            - name: CUSTOM_METRICS_FILE
              value: /etc/vbilling/files/custom-metrics.yaml
            {{- end }}
            {{- if .Values.billing.planByClass }}
            - name: PLAN_BY_CLASS
              value: {{ $p := list }}{{ range $k, $v := .Values.billing.planByClass }}{{ $p = append $p (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $p | quote }}
            {{- end }}
            {{- if .Values.crossChecks }}
            - name: CROSS_CHECKS
              value: {{ $c := list }}{{ range .Values.crossChecks }}{{ $c = append $c (printf "%s=%s:%v%%" .primary .secondary (.tolerancePercent | default 1)) }}{{ end }}{{ join "," $c | quote }}
            {{- end }}
            - name: RECORDS_SETTLE
              value: {{ .Values.records.settle | quote }}
            - name: RECORDS_RETENTION
              value: {{ .Values.records.retention | quote }}
            - name: RECORDS_ALLOW_UNKEYED
              value: {{ .Values.records.allowUnkeyed | quote }}
            - name: RECORDS_UNKNOWN_TENANTS
              value: {{ .Values.records.unknownTenants | quote }}
            - name: RECORDS_LITELLM
              value: {{ .Values.records.litellm | quote }}
            - name: RECORDS_ARCHIVE
              value: {{ and .Values.records.archive .Values.persistence.archive.enabled | quote }}
            {{- with .Values.records.pullLiteLLM }}
            {{- if .url }}
            - name: RECORDS_PULL_LITELLM_URL
              value: {{ .url | quote }}
            - name: RECORDS_PULL_LITELLM_CLIENT
              value: {{ .client | default "litellm" | quote }}
            - name: RECORDS_PULL_LITELLM_TENANT
              value: {{ .tenant | quote }}
            - name: RECORDS_PULL_LITELLM_INTERVAL
              value: {{ .interval | quote }}
            - name: RECORDS_PULL_LITELLM_LOOKBACK
              value: {{ .lookback | quote }}
            {{- include "vbilling.secretEnv" (dict "env" "RECORDS_PULL_LITELLM_KEY" "existing" .existingSecret "key" "litellm-key" "inline" .key "chartKey" "litellm-key" "root" $) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if .Values.records.formats }}
            - name: RECORDS_MAPPINGS_FILE
              value: /etc/vbilling/files/records-formats.yaml
            {{- end }}
            {{- if .Values.records.pull }}
            - name: RECORDS_PULL_FILE
              value: /etc/vbilling/files/records-pull.yaml
            {{- end }}
            {{- range .Values.records.pullEnv }}
            {{- if not (hasPrefix "RECORDS_PULL_" .name) }}
            {{- fail (printf "records.pullEnv: %s must start with RECORDS_PULL_" .name) }}
            {{- end }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef: {name: {{ .secret | quote }}, key: {{ .key | quote }}}
            {{- end }}
            - name: WATCH_DELETIONS
              value: {{ .Values.metering.watchDeletions | quote }}
            - name: DRA_GPU_DRIVERS
              value: {{ join "," .Values.metering.draGPUDrivers | default "none" | quote }}
            - name: TENANT_API
              value: {{ .Values.tenantAPI.enabled | quote }}
            - name: TENANT_KUBECONFIG_SECRET
              value: {{ .Values.tenantAPI.secretName | quote }}
            - name: TENANT_ADMIN_FALLBACK
              value: {{ .Values.tenantAPI.adminFallback | quote }}
            - name: PRIVATE_NODE_BILLING
              value: {{ .Values.tenantAPI.privateNodeBilling | quote }}
            - name: TENANT_EXCLUDE_NAMESPACES
              value: {{ join "," .Values.tenantAPI.excludeNamespaces | default "none" | quote }}
            {{- if .Values.tenantAPI.externalClustersSecret }}
            - name: TENANT_CLUSTERS_FILE
              value: /etc/vbilling/tenants/clusters.yaml
            {{- end }}
            - name: PLATFORM_CLUSTER
              value: {{ .Values.platform.cluster | quote }}
            {{- if eq .Values.tenantSource "platform" }}
            - name: PLATFORM_URL
              value: {{ required "platform.url is required when tenantSource is platform" .Values.platform.url | quote }}
            - name: PLATFORM_INSECURE
              value: {{ .Values.platform.insecure | quote }}
            - name: PLATFORM_REFRESH
              value: {{ .Values.platform.refresh | quote }}
            - name: PLATFORM_ORPHAN_GRACE
              value: {{ .Values.platform.orphanGrace | quote }}
            - name: PLATFORM_PROXY
              value: {{ .Values.platform.proxy | quote }}
            {{- if .Values.platform.caSecret }}
            - name: PLATFORM_CA_FILE
              value: /etc/vbilling/platform-ca/ca.crt
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "PLATFORM_ACCESS_KEY" "existing" .Values.platform.existingSecret "key" "access-key" "inline" .Values.platform.accessKey "chartKey" "platform-access-key" "root" .) | nindent 12 }}
            {{- end }}
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: ENFORCEMENT_MODE
              value: {{ .Values.enforcement.mode | quote }}
            - name: ENFORCEMENT_RULES
              value: {{ .Values.enforcement.rules | quote }}
            - name: ENFORCEMENT_IN_CLUSTER
              value: {{ .Values.enforcement.inCluster | quote }}
            - name: ENFORCEMENT_LITELLM
              value: {{ ((.Values.enforcement).gateway).litellm | default false | quote }}
            - name: PAUSE_KEEP_BILLING
              value: {{ .Values.enforcement.pause.keepBilling | quote }}
            - name: PAUSE_DRAIN_TIMEOUT
              value: {{ .Values.enforcement.pause.drainTimeout | quote }}
            {{- with .Values.enforcement.pause.keepNamespaces }}
            - name: PAUSE_KEEP_NAMESPACES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.prometheus.url }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: EGRESS_QUERY
              value: {{ .Values.prometheus.egressQuery | quote }}
            - name: GPU_UTIL_QUERY
              value: {{ .Values.prometheus.gpuUtilQuery | quote }}
            - name: GPU_COUNT_QUERY
              value: {{ .Values.prometheus.gpuCountQuery | quote }}
            - name: PROMETHEUS_PRESET
              value: {{ .Values.prometheus.preset | quote }}
            {{- if .Values.prometheus.bearerTokenFile }}
            - name: PROMETHEUS_BEARER_TOKEN_FILE
              value: {{ .Values.prometheus.bearerTokenFile | quote }}
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "PROMETHEUS_HEADERS" "existing" .Values.prometheus.existingSecret "key" "headers" "inline" .Values.prometheus.headers "chartKey" "prometheus-headers" "root" .) | nindent 12 }}
            {{- end }}
            {{- if .Values.prometheus.metrics }}
            - name: PROMETHEUS_METRICS_FILE
              value: /etc/vbilling/prometheus/metrics.yaml
            {{- end }}
            - name: PROMETHEUS_SOURCE_LABEL
              value: {{ .Values.prometheus.sourceLabel | quote }}
            - name: PROMETHEUS_LOOKBACK
              value: {{ .Values.prometheus.lookback | quote }}
            {{- include "vbilling.secretEnv" (dict "env" "API_TOKEN" "existing" .Values.api.existingSecret "key" "api-token" "inline" .Values.api.token "chartKey" "api-token" "root" .) | nindent 12 }}
            {{- include "vbilling.secretEnv" (dict "env" "INGEST_TOKEN" "existing" .Values.api.existingSecret "key" "ingest-token" "inline" .Values.api.ingestToken "chartKey" "ingest-token" "root" .) | nindent 12 }}
            {{- include "vbilling.secretEnv" (dict "env" "INGEST_TOKENS" "existing" .Values.api.existingSecret "key" "ingest-tokens" "inline" .Values.api.tenantIngestTokens "chartKey" "ingest-tokens" "root" .) | nindent 12 }}
            {{- if has "lago" $adapters }}
            - name: LAGO_API_URL
              value: {{ .Values.lago.apiURL | quote }}
            {{- if $lagoPriceCard }}
            - name: LAGO_PRICE_CARD
              value: /etc/vbilling/lago/price-card.yaml
            {{- end }}
            {{- with .Values.lago.managedPlans }}
            - name: LAGO_MANAGED_PLANS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "LAGO_API_KEY" "existing" .Values.lago.existingSecret "key" "api-key" "inline" .Values.lago.apiKey "chartKey" "lago-api-key" "root" .) | nindent 12 }}
            {{- end }}
            {{- if or (has "stripe" $adapters) .Values.metronome.stripeLink }}
            - name: STRIPE_API_BASE
              value: {{ .Values.stripe.apiBase | quote }}
            - name: STRIPE_API_VERSION
              value: {{ .Values.stripe.apiVersion | quote }}
            - name: STRIPE_SPLIT_METERS_BY
              value: {{ join "," .Values.stripe.splitMetersBy | default "none" | quote }}
            - name: STRIPE_AUTO_SUBSCRIBE
              value: {{ .Values.stripe.autoSubscribe | quote }}
            - name: STRIPE_MAX_RPS
              value: {{ .Values.stripe.maxRPS | quote }}
            - name: STRIPE_CANCEL_ON_REMOVE
              value: {{ .Values.stripe.cancelOnRemove | quote }}
            {{- if .Values.stripe.priceCard }}
            - name: STRIPE_PRICE_CARD
              value: /etc/vbilling/files/stripe-price-card.yaml
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "STRIPE_API_KEY" "existing" .Values.stripe.existingSecret "key" "api-key" "inline" .Values.stripe.apiKey "chartKey" "stripe-api-key" "root" .) | nindent 12 }}
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "STRIPE_WEBHOOK_SECRET" "existing" .Values.stripe.existingSecret "key" "webhook-secret" "inline" .Values.stripe.webhookSecret "chartKey" "stripe-webhook-secret" "root" .) | nindent 12 }}
            {{- if has "metronome" $adapters }}
            - name: METRONOME_API_BASE
              value: {{ .Values.metronome.apiBase | quote }}
            - name: METRONOME_RATE_CARD
              value: {{ .Values.metronome.rateCard | quote }}
            - name: METRONOME_STRIPE_LINK
              value: {{ .Values.metronome.stripeLink | quote }}
            - name: METRONOME_STRIPE_COLLECTION_METHOD
              value: {{ .Values.metronome.stripeCollectionMethod | quote }}
            {{- include "vbilling.secretEnv" (dict "env" "METRONOME_API_TOKEN" "existing" .Values.metronome.existingSecret "key" "api-token" "inline" .Values.metronome.apiToken "chartKey" "metronome-api-token" "root" .) | nindent 12 }}
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "METRONOME_WEBHOOK_SECRET" "existing" .Values.metronome.existingSecret "key" "webhook-secret" "inline" .Values.metronome.webhookSecret "chartKey" "metronome-webhook-secret" "root" .) | nindent 12 }}
            {{- if has "webhook" $adapters }}
            - name: WEBHOOK_URL
              value: {{ .Values.webhook.url | quote }}
            {{- if .Values.webhook.headers }}
            - name: WEBHOOK_HEADERS
              value: {{ $h := list }}{{ range $k, $v := .Values.webhook.headers }}{{ $h = append $h (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $h | quote }}
            {{- end }}
            {{- include "vbilling.secretEnv" (dict "env" "WEBHOOK_SECRET" "existing" .Values.webhook.existingSecret "key" "secret" "inline" .Values.webhook.secret "chartKey" "webhook-secret" "root" .) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/vbilling
            {{- if .Values.persistence.archive.enabled }}
            - name: archive
              mountPath: {{ .Values.persistence.archive.mountPath }}
            {{- end }}
            {{- if .Values.tenantAPI.externalClustersSecret }}
            - name: tenant-clusters
              mountPath: /etc/vbilling/tenants
              readOnly: true
            {{- end }}
            {{- if .Values.platform.caSecret }}
            - name: platform-ca
              mountPath: /etc/vbilling/platform-ca
              readOnly: true
            {{- end }}
            {{- if .Values.prometheus.metrics }}
            - name: prometheus-metrics
              mountPath: /etc/vbilling/prometheus
              readOnly: true
            {{- end }}
            {{- if $files }}
            - name: files
              mountPath: /etc/vbilling/files
              readOnly: true
            {{- end }}
            {{- if $lagoPriceCard }}
            - name: lago-price-card
              mountPath: /etc/vbilling/lago
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- $archiveClaim := and .Values.persistence.archive.enabled .Values.persistence.archive.existingClaim }}
      {{- if or (not .Values.persistence.enabled) .Values.tenantAPI.externalClustersSecret .Values.platform.caSecret .Values.prometheus.metrics $files $lagoPriceCard $archiveClaim }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $archiveClaim }}
        - name: archive
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.archive.existingClaim }}
        {{- end }}
        {{- if .Values.tenantAPI.externalClustersSecret }}
        - name: tenant-clusters
          secret:
            secretName: {{ .Values.tenantAPI.externalClustersSecret }}
        {{- end }}
        {{- if .Values.platform.caSecret }}
        - name: platform-ca
          secret:
            secretName: {{ .Values.platform.caSecret }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if .Values.prometheus.metrics }}
        - name: prometheus-metrics
          configMap:
            name: {{ include "vbilling.fullname" . }}-prometheus-metrics
        {{- end }}
        {{- if $files }}
        - name: files
          configMap:
            name: {{ include "vbilling.fullname" . }}-files
        {{- end }}
        {{- if $lagoPriceCard }}
        - name: lago-price-card
          configMap:
            name: {{ .Values.lago.priceCardConfigMap | default (printf "%s-lago-price-card" (include "vbilling.fullname" .)) }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- $archiveTemplate := and .Values.persistence.archive.enabled (not .Values.persistence.archive.existingClaim) }}
  {{- if or .Values.persistence.enabled $archiveTemplate }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- end }}
    {{- if $archiveTemplate }}
    - metadata:
        name: archive
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.archive.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.archive.size }}
    {{- end }}
  {{- end }}
