{{- if include "vbilling.hasFiles" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vbilling.configMapName" (dict "root" . "name" "files") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
data:
  {{- include "vbilling.filesData" . | trimPrefix "\n" | nindent 2 }}
{{- end }}
