# vBilling runs as one instance: before it meters, takes records, delivers or
# enforces, it takes the Lease "vbilling" in its own namespace, and a second
# instance waits (not Ready) until that Lease is released or expires.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vbilling.fullname" . }}-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["vbilling"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vbilling.fullname" . }}-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vbilling.fullname" . }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "vbilling.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
