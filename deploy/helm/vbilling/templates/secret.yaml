{{- $data := dict -}}
{{- if and .Values.lago.apiKey (not .Values.lago.existingSecret) }}{{ $_ := set $data "lago-api-key" .Values.lago.apiKey }}{{ end -}}
{{- if not .Values.stripe.existingSecret }}
{{- if .Values.stripe.apiKey }}{{ $_ := set $data "stripe-api-key" .Values.stripe.apiKey }}{{ end }}
{{- if .Values.stripe.webhookSecret }}{{ $_ := set $data "stripe-webhook-secret" .Values.stripe.webhookSecret }}{{ end }}
{{- end -}}
{{- if not .Values.metronome.existingSecret }}
{{- if .Values.metronome.apiToken }}{{ $_ := set $data "metronome-api-token" .Values.metronome.apiToken }}{{ end }}
{{- if .Values.metronome.webhookSecret }}{{ $_ := set $data "metronome-webhook-secret" .Values.metronome.webhookSecret }}{{ end }}
{{- end -}}
{{- if and .Values.prometheus.headers (not .Values.prometheus.existingSecret) }}{{ $h := list }}{{ range $k, $v := .Values.prometheus.headers }}{{ $h = append $h (printf "%s=%s" $k $v) }}{{ end }}{{ $_ := set $data "prometheus-headers" (join "," $h) }}{{ end -}}
{{- if and .Values.webhook.secret (not .Values.webhook.existingSecret) }}{{ $_ := set $data "webhook-secret" .Values.webhook.secret }}{{ end -}}
{{- if not .Values.api.existingSecret }}
{{- if .Values.api.token }}{{ $_ := set $data "api-token" .Values.api.token }}{{ end }}
{{- if .Values.api.ingestToken }}{{ $_ := set $data "ingest-token" .Values.api.ingestToken }}{{ end }}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vbilling.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
