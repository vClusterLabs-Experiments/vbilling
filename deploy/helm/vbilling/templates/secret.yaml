{{- $data := dict -}}
{{- if and .Values.lago.apiKey (not .Values.lago.existingSecret) }}{{ $_ := set $data "lago-api-key" .Values.lago.apiKey }}{{ end -}}
{{- if not .Values.stripe.existingSecret }}
{{- if .Values.stripe.apiKey }}{{ $_ := set $data "stripe-api-key" .Values.stripe.apiKey }}{{ end }}
{{- if .Values.stripe.webhookSecret }}{{ $_ := set $data "stripe-webhook-secret" .Values.stripe.webhookSecret }}{{ end }}
{{- end -}}
{{- if not .Values.metronome.existingSecret }}
{{- if .Values.metronome.apiToken }}{{ $_ := set $data "metronome-api-token" .Values.metronome.apiToken }}{{ end }}
{{- if .Values.metronome.webhookSecret }}{{ $_ := set $data "metronome-webhook-secret" .Values.metronome.webhookSecret }}{{ end }}
{{- end -}}
{{- if and .Values.prometheus.headers (not .Values.prometheus.existingSecret) }}{{ $h := list }}{{ range $k, $v := .Values.prometheus.headers }}{{ $h = append $h (printf "%s=%s" $k $v) }}{{ end }}{{ $_ := set $data "prometheus-headers" (join "," $h) }}{{ end -}}
{{- with .Values.records.pullLiteLLM }}{{ if and .url .key (not .existingSecret) }}{{ $_ := set $data "litellm-key" .key }}{{ end }}{{ end -}}
{{- if and .Values.platform.accessKey (not .Values.platform.existingSecret) }}{{ $_ := set $data "platform-access-key" .Values.platform.accessKey }}{{ end -}}
{{- if and .Values.webhook.secret (not .Values.webhook.existingSecret) }}{{ $_ := set $data "webhook-secret" .Values.webhook.secret }}{{ end -}}
{{- if not .Values.api.existingSecret }}
{{- /* The API is never open: without api.token the chart generates one, kept across upgrades. */}}
{{- $_ := set $data "api-token" (include "vbilling.apiToken" .) }}
{{- /* Gateways get an ingest token of their own, never the API token: given, or generated and kept across upgrades. */}}
{{- if and .Values.api.ingestToken (eq .Values.api.ingestToken .Values.api.token) }}{{ fail "api.ingestToken must differ from api.token: gateways hold the ingest token, and the API token pauses tenants and exports all usage" }}{{ end }}
{{- $_ := set $data "ingest-token" (include "vbilling.ingestToken" .) }}
{{- if .Values.api.tenantIngestTokens }}{{ $t := list }}{{ range $tenant, $tok := .Values.api.tenantIngestTokens }}{{ $t = append $t (printf "%s=%s" $tok $tenant) }}{{ end }}{{ $_ := set $data "ingest-tokens" (join "," $t) }}{{ end }}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vbilling.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
