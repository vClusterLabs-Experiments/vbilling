{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vbilling.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vbilling.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vbilling.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      # /metrics needs the API token, like every endpoint but the probes.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "vbilling.apiTokenSecret" . }}
          key: api-token
{{- end }}
