# Starting point for an AI-cloud installation. Override region, adapters,
# provider credentials, and the API Secret for your environment.
# Storage and memory must be sized from measured request volume; these are
# initial allocations, not a throughput guarantee. See configuration.html#sizing.
region: REPLACE_WITH_REGION
clusterName: REPLACE_WITH_HOST_CLUSTER

billing:
  collectionDelay: 75s
  priceCheck:
    mode: hold

records:
  unknownTenants: reject

persistence:
  size: 100Gi
  archive:
    enabled: true
    # Provision this PVC separately, with sufficient dispute retention.
    existingClaim: vbilling-archive

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Enable only when Prometheus Operator's ServiceMonitor CRD is installed.
serviceMonitor:
  enabled: false
